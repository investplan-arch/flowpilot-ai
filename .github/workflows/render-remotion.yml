name: Render Remotion Reel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "remotion/**"
      - ".github/workflows/render-remotion.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: remotion

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Render final FlowPilot ad
        run: npm run render

      - name: Verify MP4 exists
        run: |
          test -s out/flowpilot-ad-final.mp4
          node -e "const fs=require('fs'); const s=fs.statSync('out/flowpilot-ad-final.mp4').size; if(s<100000) process.exit(1); console.log('MP4 size:', s, 'bytes')"

      - name: Upload final reel artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowpilot-ad-final
          path: remotion/out/flowpilot-ad-final.mp4
          if-no-files-found: error
          retention-days: 30
