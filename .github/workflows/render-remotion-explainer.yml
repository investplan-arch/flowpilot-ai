name: Render FlowPilot Explainer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "remotion/src/FlowPilotExplainer.tsx"
      - "remotion/src/FlowPilotExplainerMarketing.tsx"
      - "remotion/src/Root.tsx"
      - "remotion/package.json"
      - ".github/workflows/render-remotion-explainer.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: remotion

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Render FlowPilot explainer
        run: npm run render:explainer

      - name: Verify MP4 exists
        run: test -s out/flowpilot-explainer.mp4

      - name: Upload explainer artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowpilot-explainer
          path: remotion/out/flowpilot-explainer.mp4
          if-no-files-found: error
          retention-days: 30
