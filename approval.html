<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><title>DotacjaPlus • Rozmowy</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f1f5f9;color:#0f172a}.top{position:sticky;top:0;z-index:5;background:#0f172a;color:#fff;padding:18px}.top h1{margin:0;font-size:24px}.top p{margin:5px 0 0;color:#94a3b8;font-size:13px}.wrap{max-width:900px;margin:auto;padding:14px}.search{width:100%;border:1px solid #cbd5e1;border-radius:14px;padding:13px 15px;font-size:16px;background:#fff;margin-bottom:12px}.layout{display:grid;grid-template-columns:280px 1fr;gap:14px}.list,.conversation{background:#fff;border:1px solid #e2e8f0;border-radius:18px;overflow:hidden}.list{max-height:76vh;overflow:auto}.client{padding:15px;border-bottom:1px solid #e2e8f0;cursor:pointer}.client.active{background:#ecfdf5}.client b{display:block}.client small{display:block;color:#64748b;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.conversation{padding:18px}.empty{padding:28px;text-align:center;color:#64748b}.badge{display:inline-block;background:#dcfce7;color:#166534;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700}.id{font-size:12px;color:#94a3b8;margin:7px 0 18px}.card{border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin:12px 0}.card.ai{border:2px solid #86efac}.label{font-size:12px;font-weight:800;color:#64748b;margin-bottom:9px}.ai .label{color:#15803d}.text{white-space:pre-wrap;font-size:17px;line-height:1.45}.actions{display:grid;gap:9px;margin-top:16px}.btn{width:100%;border:0;border-radius:13px;padding:15px;font-size:17px;font-weight:800;color:#fff}.send{background:#16a34a}.edit{background:#f59e0b}.manual{background:#334155}.status{font-size:12px;color:#64748b;margin:10px 2px}@media(max-width:700px){.wrap{padding:10px}.layout{grid-template-columns:1fr}.list{max-height:220px}.conversation{padding:15px}}</style></head><body><header class="top"><h1>DotacjaPlus</h1><p>Centrum rozmów • Messenger → AI → akceptacja</p></header><main class="wrap"><input id="search" class="search" placeholder="Szukaj klienta lub wiadomości…" oninput="renderList()"><div id="status" class="status"></div><div class="layout"><section id="list" class="list"></section><section id="conversation" class="conversation"></section></div></main><script>const HOOK='https://hook.eu1.make.com/lvcjs5jchwwatu6m851i8xm5tjwd3s1o';let clients={"29168943666030629":{"messenger_id":"29168943666030629","ostatnia_wiadomosc_klienta":".","ostatni_szkic_ai":"Dzień dobry, w czym mogę pomóc? Proszę krótko opisać planowaną inwestycję oraz napisać, czy działalność jest już prowadzona, czy dopiero planuje ją Pan, Pani lub Państwo rozpocząć."}},selected="29168943666030629";const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function label(c){return c.nazwa||c.imie||('Klient • '+String(c.messenger_id||'').slice(-6))}function renderList(){const q=document.getElementById('search').value.toLowerCase();const arr=Object.entries(clients).filter(([id,c])=>(label(c)+' '+id+' '+(c.ostatnia_wiadomosc_klienta||'')).toLowerCase().includes(q));document.getElementById('status').textContent=Object.keys(clients).length+' rozmów';document.getElementById('list').innerHTML=arr.length?arr.map(([id,c])=>`<div class="client ${id===selected?'active':''}" onclick="selectClient('${id}')"><b>${esc(label(c))}</b><small>${esc(c.ostatnia_wiadomosc_klienta||'Brak treści')}</small></div>`).join(''):'<div class="empty">Brak rozmów</div>'}function selectClient(id){selected=id;renderList();renderConversation();if(innerWidth<701)document.getElementById('conversation').scrollIntoView({behavior:'smooth'})}function form(action,c,cls,title){return `<form action="${HOOK}" method="get"><input type="hidden" name="action" value="${action}"><input type="hidden" name="client_id" value="${esc(c.messenger_id)}"><input type="hidden" name="source" value="messenger"><textarea name="message" style="display:none">${esc(c.ostatnia_wiadomosc_klienta||'')}</textarea><textarea name="draft" style="display:none">${esc(c.ostatni_szkic_ai||'')}</textarea><button class="btn ${cls}" type="submit">${title}</button></form>`}function renderConversation(){const c=clients[selected],box=document.getElementById('conversation');if(!c){box.innerHTML='<div class="empty">Wybierz rozmowę</div>';return}box.innerHTML=`<span class="badge">DO AKCEPTACJI</span><h2 style="margin:10px 0 0">${esc(label(c))}</h2><div class="id">Klient Messenger • ${esc(String(c.messenger_id).slice(-6))}</div><div class="card"><div class="label">WIADOMOŚĆ KLIENTA</div><div class="text">${esc(c.ostatnia_wiadomosc_klienta||'Brak zapisanej treści')}</div></div><div class="card ai"><div class="label">SZKIC AI</div><div class="text">${esc(c.ostatni_szkic_ai||'Brak szkicu AI')}</div></div><div class="actions">${form('send',c,'send','WYŚLIJ')}${form('edit',c,'edit','POPRAW')}${form('manual',c,'manual','PRZEJMUJĘ')}</div>`}renderList();renderConversation()</script></body></html>
