<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ikona Meta 1024 px</title><style>body{background:#0b1220;color:#fff;font:18px/1.5 system-ui;margin:0;padding:28px;max-width:620px}button,a{display:block;background:#1672ef;color:#fff;border:0;border-radius:12px;padding:16px;margin:18px 0;font:inherit;text-align:center}input{max-width:100%}canvas{max-width:100%;height:auto}p{color:#d4deef}[hidden]{display:none}</style><h1>Zmniejsz ikonę do Meta</h1><p>Wybierz zapisane logo. Obraz pozostaje na Twoim urządzeniu.</p><input id="file" type="file" accept="image/*"><p id="status" role="status"></p><a id="download" hidden download="FlowPoint-1024.jpg">Pobierz ikonę 1024 × 1024</a><button id="share" hidden>Zapisz lub udostępnij plik</button><canvas id="preview" width="1024" height="1024" hidden></canvas><script>
const picker=document.getElementById('file'),status=document.getElementById('status'),canvas=document.getElementById('preview'),download=document.getElementById('download'),share=document.getElementById('share');let blob,url;
picker.addEventListener('change',async()=>{download.hidden=true;share.hidden=true;canvas.hidden=true;const f=picker.files[0];if(!f)return;status.textContent='Przetwarzam…';const source=URL.createObjectURL(f);try{const img=new Image();img.src=source;await img.decode();const ctx=canvas.getContext('2d');ctx.fillStyle='#0b1220';ctx.fillRect(0,0,1024,1024);const scale=Math.min(1024/img.naturalWidth,1024/img.naturalHeight);const w=img.naturalWidth*scale,h=img.naturalHeight*scale;ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,(1024-w)/2,(1024-h)/2,w,h);blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',0.92));if(!blob||blob.size>=5*1024*1024)throw new Error('Nie udało się zapisać pliku poniżej 5 MB.');if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);download.href=url;download.hidden=false;canvas.hidden=false;const file=new File([blob],'FlowPoint-1024.jpg',{type:'image/jpeg'});share.hidden=!(navigator.canShare&&navigator.canShare({files:[file]}));status.textContent='Gotowe: 1024 × 1024 px, JPG, '+Math.ceil(blob.size/1024)+' KB. W Meta wybierz ten pobrany plik zamiast oryginału.';}catch(e){status.textContent='Nie udało się odczytać obrazu. Wybierz JPG lub PNG. '+e.message;}finally{URL.revokeObjectURL(source);}});
share.addEventListener('click',async()=>{if(!blob)return;try{await navigator.share({files:[new File([blob],'FlowPoint-1024.jpg',{type:'image/jpeg'})]});}catch(e){if(e.name!=='AbortError')status.textContent='Skorzystaj z przycisku Pobierz ikonę.';}});
</script></html>
